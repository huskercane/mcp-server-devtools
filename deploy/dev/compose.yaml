name: mcp-devtools-dev
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7@sha256:45ae20191531eb608ddb0b775d012b40d3e4f942697f3214694887dd7c108d13
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
      - identity:/opt/keycloak/data
  mcp:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile
    # Both the browser and server reach the identical loopback issuer URL.
    network_mode: service:keycloak
    depends_on:
      keycloak:
        condition: service_started
    environment:
      CARGO_BUILD_JOBS: "4"
      MCP_AUTH_MODE: oidc
      MCP_OIDC_PROFILE: keycloak
      MCP_OIDC_ISSUER: http://localhost:8080/realms/mcp
      MCP_OIDC_AUDIENCE: api://mcp-devtools
      MCP_TENANT: local-dev
      MCP_CONSOLE_CLIENT_ID: mcp-console
      MCP_PUBLIC_URL: https://localhost:8443
      MCP_BIND_ADDR: 0.0.0.0:3000
      MCP_ADMIN_APPROVALS: required
      LOG_STDERR: "on"
    volumes:
      - ../..:/workspace:ro
      - build:/build
      - registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - state:/state
      - tls:/tls
    healthcheck:
      test: [CMD, /build/debug/mcp-devtools, health]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20m
  proxy:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    network_mode: service:keycloak
    depends_on:
      mcp:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - tls:/tls:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/console"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  identity:
  build:
  registry:
  cargo-git:
  state:
  tls:
