{{- if .Values.ingress.enabled }}
{{- if not (or .Values.roles.gateway.enabled .Values.roles.control.enabled) }}
{{- fail "ingress requires an enabled role" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
{{- if .Values.roles.control.enabled }}
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp.fullname" . }}-control
                port: {name: http}
{{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp.fullname" . }}-{{ ternary "gateway" "control" .Values.roles.gateway.enabled }}
                port: {name: http}
{{- end }}
