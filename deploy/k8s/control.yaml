# The control role: SIEM forwarding (C.3), admin API (C.4), and rollups
# (C.6). The safe starter below is auth-off/loopback, so admin is disabled.
# See docs/admin-api-runbook.md before configuring inbound OIDC and ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-devtools-control
  namespace: mcp-devtools
  labels: { app: mcp-devtools, role: control }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-devtools, role: control }
  template:
    metadata:
      labels: { app: mcp-devtools, role: control }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control
          # Same release as the gateway; pin the digest where possible.
          image: ghcr.io/huskercane/mcp-devtools:v0.16.1
          args: ["--role", "control"]
          ports:
            - name: http
              containerPort: 3000
          env:
            # The control role holds no vendor credentials and serves no
            # tool traffic. To enable admin, configure inbound OIDC, signed
            # policy/revocations, and a writable signed audit journal.
            - { name: MCP_AUTH_MODE, value: "off" }
            - { name: MCP_BIND_ADDR, value: "127.0.0.1" }
            # --- Audit forwarding to a SIEM (WP C.3) -----------------------
            # The control role ships the gateway's journal to the receiver
            # named here; the gateway never does (its budget is the request
            # path). The journal it reads is the gateway's volume, mounted
            # read-only below; the cursor lives on the control replica's own
            # volume. Uncomment one receiver. See docs/siem-forwarding-runbook.md.
            #- { name: MCP_AUDIT_FORWARD_URL, value: "syslog+tls://syslog-relay.logging.svc:6514" }
            #- { name: MCP_AUDIT_FORWARD_CA_FILE, value: "/forward-tls/ca.pem" }
            #- { name: MCP_AUDIT_FORWARD_CLIENT_CERT, value: "/forward-tls/tls.crt" }
            #- { name: MCP_AUDIT_FORWARD_CLIENT_KEY, value: "/forward-tls/tls.key" }
            #- { name: MCP_AUDIT_FORWARD_URL, value: "https://splunk-hec.example:8088/services/collector/event" }
            #- { name: MCP_AUDIT_FORWARD_TOKEN, value: "file:///forward-secrets/hec-token" }
            #- { name: MCP_AUDIT_FORWARD_JOURNAL_DIR, value: "/gateway-journal" }
            #- { name: MCP_AUDIT_FORWARD_STATE_DIR, value: "/forward-state" }
            #- { name: MCP_AUDIT_FORWARD_ORIGIN, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            # --- Usage rollups and Prometheus metrics (WP C.6) ------------
            # In the current split-role topology gateways do not yet push
            # usage here (CF-33), so apply these settings to MCP_ROLE=all
            # until that transport lands.
            #- { name: MCP_ROLLUP_STORE, value: "sqlite:///var/lib/mcp-devtools/usage.db" }
            #- { name: MCP_ROLLUP_RETENTION_DAYS, value: "90" }
            #- { name: MCP_USAGE_CHANNEL_CAPACITY, value: "4096" }
            #- { name: MCP_METRICS, value: "on" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # For forwarding: the gateway's journal (ReadWriteMany, or the
            # same node's volume in a single-node cluster), the cursor
            # directory, and the receiver's TLS material.
            #- { name: gateway-journal, mountPath: /gateway-journal, readOnly: true }
            #- { name: forward-state, mountPath: /forward-state }
            #- { name: forward-tls, mountPath: /forward-tls, readOnly: true }
            #- { name: rollups, mountPath: /var/lib/mcp-devtools }
          readinessProbe:
            exec: { command: ["/mcp-devtools", "health"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        #- name: gateway-journal
        #  persistentVolumeClaim: { claimName: mcp-devtools-journal, readOnly: true }
        #- name: forward-state
        #  persistentVolumeClaim: { claimName: mcp-devtools-forward-state }
        #- name: forward-tls
        #  secret: { secretName: mcp-devtools-forward-tls }
        #- name: rollups
        #  persistentVolumeClaim: { claimName: mcp-devtools-rollups }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-devtools-control
  namespace: mcp-devtools
spec:
  selector: { app: mcp-devtools, role: control }
  ports:
    - name: http
      port: 80
      targetPort: http
