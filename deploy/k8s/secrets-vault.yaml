# Vendor credentials as `vault://` references resolved by the gateway itself
# (plan §3.8, C.2b) — the native alternative to the CSI volume in
# `secrets-csi.yaml`. The gateway authenticates to Vault with its own
# projected service-account token (Kubernetes auth), reads the KV v2
# secrets on the refresh interval, and every audit record carries the KV
# version that acted. No plaintext on a volume, and every read is in Vault's
# own audit log under the gateway's identity.
#
# Vault-side setup (docs/secret-sources-runbook.md):
#   vault auth enable kubernetes
#   vault write auth/kubernetes/config kubernetes_host="https://$KUBERNETES_SERVICE_HOST:443"
#   vault write auth/kubernetes/role/mcp-devtools \
#     bound_service_account_names=mcp-devtools bound_service_account_namespaces=mcp-devtools \
#     token_policies=mcp-devtools token_ttl=1h token_max_ttl=24h
#   vault policy write mcp-devtools - <<'HCL'
#   path "secret/data/mcp/*" { capabilities = ["read"] }
#   HCL
#   vault kv put secret/mcp/grafana token=glsa_…
#
# Apply this after `config.yaml`; it adds to the gateway's environment and
# replaces the `envFrom: secretRef` credential injection in `gateway.yaml`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-devtools
  namespace: mcp-devtools
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-devtools-vault
  namespace: mcp-devtools
data:
  MCP_VAULT_ADDR: "https://vault.vault.svc:8200"
  MCP_VAULT_AUTH: "kubernetes"
  MCP_VAULT_ROLE: "mcp-devtools"
  # Private CA: mount the PEM and name it here.
  # MCP_VAULT_CACERT: "/vault-ca/ca.pem"
  # Vault Enterprise / HCP: the namespace the mounts live in.
  # MCP_VAULT_NAMESPACE: "admin/platform"
  # The references. `#key` is required: a KV secret is a document of keys,
  # and a multi-part credential is one document so its halves rotate together.
  GRAFANA_TOKEN: "vault://secret/mcp/grafana#token"
  # ATLASSIAN_USER_EMAIL: "vault://secret/mcp/atlassian#email"
  # ATLASSIAN_API_TOKEN:  "vault://secret/mcp/atlassian#token"
  MCP_SECRET_REFRESH_INTERVAL_SECONDS: "30"
---
# In gateway.yaml: run as this service account and take the environment
# from the ConfigMap above instead of the credentials Secret.
#
#   spec:
#     serviceAccountName: mcp-devtools
#     containers:
#       - name: gateway
#         envFrom:
#           - configMapRef: { name: mcp-devtools-config }
#           - configMapRef: { name: mcp-devtools-vault }
#
# The gateway refuses to start if a reference cannot be resolved (Vault
# unreachable, role not bound, path not granted), naming the reference; at
# runtime a failing refresh keeps the last good values and the health banner
# reports it.
