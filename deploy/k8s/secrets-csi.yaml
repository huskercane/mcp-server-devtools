# Vendor credentials as secret *references* over a CSI Secrets Store volume
# (plan §3.8, C.2a). Optional: `gateway.yaml` as shipped injects the
# credentials from a Kubernetes Secret through `envFrom`, which is fixed
# for the life of the pod. This file replaces that with a mounted volume the
# kubelet refreshes, so a rotated secret reaches the gateway **without a
# restart** and every audit record names the version that acted.
#
# Two ways to get the volume, same gateway configuration either way:
#
#   1. A plain Kubernetes Secret, projected as files (the `volumes` stanza
#      below, first form). The kubelet re-projects it on change (typically
#      within its sync period, ~1–2 minutes). No driver needed.
#   2. The Secrets Store CSI driver with your provider — the
#      `SecretProviderClass` below is written for Vault; the AWS and Azure
#      providers differ only in the `provider:` and `parameters:` block
#      (their reference docs are linked inline). The driver re-syncs on its
#      own rotation interval (`--rotation-poll-interval`, typically 2 m).
#
# The gateway re-reads referenced files every `MCP_SECRET_REFRESH_INTERVAL_SECONDS`
# (default 30) and swaps the values in whole; multi-part credentials taken
# from one JSON document (`#email` and `#token` below) always change together.
# Startup refuses to run if a referenced file is missing or a key is absent;
# a file that vanishes later keeps the last good value in force and the health
# banner says so (`docs/configuration.md`, "Secret references").
---
# Form 1: a Kubernetes Secret, mounted as files. Each key is a file; a key
# that holds a JSON object serves several `#key` references atomically.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-devtools-vendor-credential-files
  namespace: mcp-devtools
type: Opaque
stringData:
  grafana.json: |
    {"token": "REPLACE-WITH-A-READ-ONLY-SERVICE-ACCOUNT-TOKEN"}
  atlassian.json: |
    {"email": "svc@example.com", "token": "REPLACE-WITH-AN-API-TOKEN"}
---
# Form 2: the Secrets Store CSI driver, Vault provider.
# https://developer.hashicorp.com/vault/docs/platform/k8s/csi
# AWS:   https://github.com/aws/secrets-store-csi-driver-provider-aws
# Azure: https://azure.github.io/secrets-store-csi-driver-provider-azure/
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mcp-devtools-vendor-credentials
  namespace: mcp-devtools
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.example.internal:8200"
    roleName: "mcp-devtools-gateway"        # Kubernetes auth role bound to the gateway's ServiceAccount
    # vaultNamespace: "engineering"         # Vault Enterprise
    objects: |
      - objectName: "grafana.json"           # the file name under the mount
        secretPath: "secret/data/mcp-devtools/grafana"
        secretKey: ""                         # empty: the whole KV v2 `data` map as JSON
      - objectName: "atlassian.json"
        secretPath: "secret/data/mcp-devtools/atlassian"
        secretKey: ""
---
# The non-secret settings: references instead of values. Merge into the
# `mcp-devtools-config` ConfigMap from `config.yaml` (shown standalone here
# so the diff against `envFrom: secretRef` is visible).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-devtools-secret-references
  namespace: mcp-devtools
data:
  GRAFANA_TOKEN: "file:///secrets/grafana.json#token"
  ATLASSIAN_USER_EMAIL: "file:///secrets/atlassian.json#email"
  ATLASSIAN_API_TOKEN: "file:///secrets/atlassian.json#token"
  MCP_SECRET_REFRESH_INTERVAL_SECONDS: "30"
---
# What changes in `gateway.yaml` (apply as a patch or edit in place):
#
#   spec.template.spec.containers[0].envFrom:
#     - configMapRef: { name: mcp-devtools-config }
#     - configMapRef: { name: mcp-devtools-secret-references }
#     # remove: - secretRef: { name: mcp-devtools-vendor-credentials }
#
#   spec.template.spec.containers[0].volumeMounts:
#     - { name: vendor-credentials, mountPath: /secrets, readOnly: true }
#
#   spec.template.spec.volumes:
#     # Form 1 — a Kubernetes Secret, re-projected by the kubelet on change.
#     # Do not add subPath: it freezes the projection, and the gateway would
#     # never see a rotation.
#     - name: vendor-credentials
#       secret: { secretName: mcp-devtools-vendor-credential-files, defaultMode: 0440 }
#
#     # Form 2 — the CSI driver.
#     - name: vendor-credentials
#       csi:
#         driver: secrets-store.csi.k8s.io
#         readOnly: true
#         volumeAttributes:
#           secretProviderClass: mcp-devtools-vendor-credentials
#
# `fsGroup: 65532` in the pod security context (already set) is what makes a
# `0440` projection readable by the non-root gateway user.
