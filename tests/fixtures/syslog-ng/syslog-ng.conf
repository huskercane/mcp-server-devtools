# syslog-ng receiver for the `siem` CI job and `tests/siem_live_tests.rs`
# (plan §3.9 "Audit forwarding", WP C.3): RFC 5424 over RFC 5425 octet
# counting on TLS port 6514, **mutual TLS required** against the fixture CA
# in tests/fixtures/tls/, every message appended to one file as
# `<MSGID> <MSG>` so the test can read the journal line back and compare it
# byte for byte. `flush-lines(1)` so the test does not wait on a buffer.
@version: 4.8
@include "scl.conf"

options {
  keep-hostname(yes);
  stats(level(1));
};

source s_mcp_tls {
  syslog(
    ip("0.0.0.0")
    port(6514)
    transport("tls")
    tls(
      key-file("/etc/syslog-ng/tls/server-key.pem")
      cert-file("/etc/syslog-ng/tls/server.pem")
      ca-file("/etc/syslog-ng/tls/ca.pem")
      peer-verify(required-trusted)
    )
  );
};

destination d_mcp_audit {
  file(
    "/var/log/mcp-audit/messages"
    template("${MSGID} ${MSG}\n")
    create-dirs(yes)
    dir-perm(0755)
    perm(0644)
    flush-lines(1)
  );
};

log { source(s_mcp_tls); destination(d_mcp_audit); };
